[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colab-manager"
version = "0.1.0"
description = "Multi-account manager and unified usage/session CLI for Google Colab CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-colab-cli>=0.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",
    "filelock>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
colabm = "colab_manager.cli:main"
cm = "colab_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
